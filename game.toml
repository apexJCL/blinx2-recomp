# Placements (extract --placements): what a stage spawns at load, from
# .data tables of u32 pointers indexed by stage_current (0xB87168; M21 is
# 5), each to {u32 count, records *}. A record starts with the class dword
# (class, variant, flags in the top byte), pos at +4 and rotation (radians,
# X first) at +0x14. openspec/changes/archive/2026-11-03-placements-spike/design.md.
# Enemies: sub_0004F970 -> sub_0004F5C0 -> ent_enemy_spawn (sub_0004EE20).
# sub_0004F970 loads [s]; in Sweepers an x-4 boss stage (s % 5 == 3)
# loads [s - 2] instead.
[[extract.placement_set]]
name = "enemy"
table = 0x004921E8
stride = 0x5C
pos_at = 4
rot_at = 0x14
size = 6.0
# Items (1P set): stage setup sub_000783B0 -> ent_item_spawn (0x794D0).
# It reads 0x491D08 instead when 0xB22E3C is 2 (the two-player set,
# sub_00098E30, menu_player_count 2), and 0x492968 in the hub drills
# (0xEC4CF8, or 0xEC4CE0 with stage_current == 0xB871AC). Outside M64
# (0x1C) the item and collectible loops skip records when team mode
# 0xB21CB4 >= 2 or 0xB21C9C != 0; Sweepers is unaffected. On M14 in
# Sweepers the item loop (0x784C4-0x784F7) spawns only records whose
# class dword is 0x23, so the export draws items the game never spawns.
[[extract.placement_set]]
name = "item"
table = 0x00491C18
stride = 0x28
pos_at = 4
rot_at = 0x14
size = 3.0
# Collectibles: the same setup then spawns 0x491DF8[s] through
# ent_item_spawn: time stones (item types 0x2A-0x35), coins (0x36-0x41),
# medals (0x42-0x47) and Tom Tom medals (0x48-0x4D). It skips them in
# the hub drills (0xEC4CF8, or 0xEC4CE0 with stage_current == 0xB871AC),
# the same condition that selects 0x492968.
[[extract.placement_set]]
name = "collectible"
table = 0x00491DF8
stride = 0x28
pos_at = 4
rot_at = 0x14
size = 2.0
# Gimmicks (doors, blocks, lifts): sub_000C1D20 from sub_000606F0 loads
# [s] and, in Sweepers with one player at an area's first stage
# (s % 5 == 0), [s + 1] and [s + 4]; class init through
# 0x403A00[class]. layers lists all three, so the export assumes
# Sweepers, one player at an area's first stage.
[[extract.placement_set]]
name = "gimmick"
table = 0x00491EE8
stride = 0x2C
pos_at = 4
rot_at = 0x14
layers = [0, 1, 4]
size = 8.0
# Effect emitters (no model): sub_000322F0 -> sub_000327F0. Both tables
# load [s], and at an area's first stage [s + 1] and [s + 4] too.
[[extract.placement_set]]
name = "emitter"
table = 0x00492788
stride = 0x28
pos_at = 4
rot_at = 0x14
layers = [0, 1, 4]
size = 2.0
[[extract.placement_set]]
name = "emitter2"
table = 0x00492878
stride = 0x28
pos_at = 4
rot_at = 0x14
layers = [0, 1, 4]
size = 2.0
# Ambient critters: sub_000E0760. M21 holds only class word 0x102
# (class 0x02, variant 1), whose model is not known yet; gulls are 0x01.
[[extract.placement_set]]
name = "ambient"
table = 0x004922D8
stride = 0x30
pos_at = 4
rot_at = 0x14
