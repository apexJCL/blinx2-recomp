# The CLI and the toolkit, each at a release tag or a bare commit. The
# commit locks the tag: a tag that names another commit (moved, re-pushed)
# is refused.
[cli]
tag = "v0.22.0"
commit = "a994f6aec0972346f65063bd2586398aad1e4b21"
url = "https://github.com/apexJCL/xboxrecomp-cli.git"

[toolkit]
url = "https://github.com/apexJCL/xboxrecomp.git"
tag = "blinx2-v0.15.0"
branch = "blinx2/portability"
commit = "92f8954cac77fb95f11955ebd0b28b1267a31fdb"

[toolchain]
llvm_mingw = "20260922"
nsis = "3.13"

[pipeline]
game_name = "cat"
gen = "src/recomp/gen"
out = "analysis"
seeds = ["config/seed_functions.json"]
icall_seeds = true
spin_waits = "config/spin_waits.json"
exclude_manual = "src/recomp_manual.c"
split = 250
names_hooks = ["scripts/host_reserved_names.py"]
ghidra = true
# Names and notes for gen (openspec change gen-names; the CLI's
# docs/symbols.md). Needs a CLI with [pipeline] symbols.
symbols = "config/symbols.toml"

[pipeline.disasm]
text_only = true
extra_sections = ["D3D", "D3DX", "XGRPH", "DSOUND", "PSFD_I", "PSFD_B", "PSFD_P", "PSFD00", "SRCADV", "SRCED", "SRCAC", "XPP"]

# Functions the hud mod hooks (openspec change hud-anchors, section 3):
# sub_00042190 adds a 2D sprite to the draw queue and copies its vertices,
# so a pre hook may move them and a post hook restore them. The three
# sprite helpers, the digit helper sub_00018030, sub_00018250 (which counts
# a number's digits and tail-jumps into it), the sprite helper sub_00017330
# (the time-control legend) and the font routine are
# wrappers in config/hud.toml, so a sprite is keyed by its call site in the
# HUD code, not inside a helper.
# The entities mod (openspec change entity-mod-api, D9): sub_0004E700
# (ent_enemy_update_all) runs the queued spawns and kills in its pre hook.
# Its two callers (0x673A4, 0x673BB) pop its argument and read no float,
# which the x87 walk cannot see through its calls. stage_area_setup
# (sub_000606F0) is the free camera's wrapper in src/recomp_manual.c, which
# calls the entity API itself.
# The crystals mod (openspec change crystal-sets, D1): sub_0008BFD0
# (tc_crystal_collect) gets a pre and a post, neither of which skips. It
# returns 0 or 1 in eax (an item taken or not) and never a float; the x87
# walk cannot see through its calls.
# The shop mod (openspec change shop-api, D3, D8): sub_001A0260
# (plr_gun_fire) scales the shots each call made and the gun's fire timer in
# its post hook. Its two callers (0x1A005E, 0x1A012D) pop the FPU stack
# before the call and read no float after it.
# The walls mod (openspec change collision-spike, task 1.7): sub_00165630
# (the collision triangle test) gets a pre and a post that may rewrite its
# contact outputs, sub_001636C0 (the sphere query) a pre and a post that
# tell the player's queries apart by return address, and sub_00163160 (the
# dynamic objects' query) a post for the trace. None skips; all three
# return 0 or 1 in eax and never a float.
# The fdm mod (openspec change b2-full-diagonal-movement): sub_002D675C
# (the CRT pow behind the speed's time-scale factor) gets a pre that acts
# only on its call from the walk (return 0x17C8FC), where the stick the
# clamp reads is in the caller's frame; sub_00176150 (ent_player_update)
# a pre and a post that put the speed table back. None skips. pow returns
# its float in st0; ent_player_update returns none.
[mods]
hook_functions = ["0x00042190", "0x000177F0", "0x000178C0", "0x00018030", "0x00018250", "0x00017330", "0x00047A00", "0x00048600", "0x0004E700", "0x0008BFD0", "0x00163160", "0x001636C0", "0x00165630", "0x001A0260", "0x00176150", "0x002D675C"]
no_st0 = ["0x0004E700", "0x0008BFD0", "0x001A0260", "0x00176150"]
st0 = ["0x002D675C"]

[build]
exe = "cat_recomp"
targets = ["windows", "macos"]
windows_dir = "build-win"
macos_dir = "build"
# Passed on every packaging configure so a cache cannot keep a non-stock
# value; nonstock_vars are what package refuses without --allow-nonstock.
# The APU DSP is compiled in and runs by default (RECOMP_APU_DSP=0: the stub).
stock_cmake = ["-DXBOXRECOMP_ENHANCE=ON", "-DXBOXRECOMP_APU_DSP=ON", "-UCAT_GEN_OPT"]
nonstock_vars = ["CAT_GEN_OPT"]
icon_var = "CAT_APP_ICON"

# What a build needs, for the job count and the disk check (the CLI's
# docs/manifest.md). Measured on the Mac: one generated-code compile
# (recomp_0017.c) peaks at 1220 MiB and disasm at 1722 MiB; analysis/ and
# gen/ take about 1.2 GB on disk, and the imported game_files/ 3.3 GB.
# Measured peaks raise these, never lower them.
[build.resources]
gen_job_mib = 1220
tool_mib = 1722
tool_step = "disasm"
generate_mib = 1280
game_files_mib = 3187

[data]
game_files = "game_files"
game_files_exclude = ["default_analysis.json", "UDATA", "TDATA"]
# The full dump's file count, without the names above: doctor reports a
# dump with more or fewer (information only).
reference_files = 485
dir_env = "BLINX2_DATA_DIR"
windows = "%LOCALAPPDATA%\\BLiNX2"
steamos = "~/Games/BLiNX2"
macos = "~/Library/Application Support/BLiNX2"

# Save import (`blinx2 saves import`, openspec save-import).
[saves]
title_ids = [0x4D530065]
# Every import re-signs blinx2data.bin under this build's zero key.
signing = "resign"
# BLiNX 2 writes nothing to TDATA (task 0.4).
tdata = "ignore"

[[saves.signed]]
glob = "*/blinx2data.bin"
size = 81920
data = [0, 33972]
digest = 33972
key = "roamable"

[input]
script_env = "RECOMP_INPUT_SCRIPT"
presets = ["@attract", "@stage1", "@stage1-enemies", "@stage1-2", "@stage1-2-barricade", "@story-hub", "@story-load", "@story-idle"]

[golden]
json = "analysis/golden/golden.json"
frames = "analysis/golden/frames"
audio = "analysis/golden/audio.json"
# The game's own enhancement keys at their stock values (docs/env.md): a
# golden run showing another value is not a stock run.
enhance_stock = { "camera.free" = "off", "fps.mode" = "lock30", "fx.glow" = "on", "fx.glow_intensity" = "1", "mods.glow.enable" = "on", "mods.lod.enable" = "off", "mods.debug_menu.enable" = "off", "mods.entities.enable" = "off", "mods.crystals.enable" = "off", "mods.shop.enable" = "off", "mods.walls.enable" = "off", "mods.collision.enable" = "off", "mods.fdm.enable" = "off", "mods.speed.enable" = "off", "present.profile" = "none" }

[package]
app = "BLiNX2"
product = "blinx2-recomp"
targets = ["windows", "steamos", "macos"]
brew = ["sdl2", "sdl3", "openssl", "libepoxy"]
dylib_companions = ["libSDL3.dylib=brew:sdl3"]
content = "packaging"
# The launch.env key the bundle sets to the dump's fingerprint; main.c
# prints it at boot ([BOOT] build xbe:).
stamp_env = "RECOMP_BUILD_XBE"
templates = "packaging"
icon = "xbe"

# The player build wizard (the CLI's docs/wizard.md): a windowed program
# that clones this repo at the release tag, checks the host, asks for the
# dump, a target and these options, and runs package. `./blinx2 wizard
# build` makes its three downloads from this table at a tag.
[wizard]
repo = "https://github.com/apexJCL/blinx2-recomp.git"
targets = ["windows", "steamos", "macos"]
# No [[wizard.fetch]] entries: the clone carries everything else the build
# needs, and the CLI fetches the toolkit, llvm-mingw and NSIS itself by
# the pins in [cli], [toolkit] and its setup-pins.json.

# The wizard's open-source credits (xboxrecomp-cli docs/wizard.md,
# Credits): this repo is mine, listed first, before the CLI's repos.
[[wizard.credit]]
name = "blinx2-recomp"
role = "this recompilation of BLiNX 2 for PC and Mac"
license = "MIT"
url = "https://github.com/apexJCL/blinx2-recomp"
own = true

# Third party, ahead of the CLI's third-party list: the HUD pack's font,
# installed by the player (never vendored); the GitHub page of its Google
# Fonts sources.
[[wizard.credit]]
name = "PT Sans Narrow"
role = "the sharper HUD's font"
license = "OFL-1.1"
url = "https://github.com/google/fonts/tree/main/ofl/ptsansnarrow"

# Only the basic tweaks: everything else (pacing, keyboard, mouse, filter,
# glow) is in config.default.toml, which the Options page points to.
[[wizard.option]]
key = "scale"
label = "Render scale"
hint = "Draws the game sharper on a big screen; needs a faster graphics card."
kind = "range"
# The toolkit's render.scale stops at 4 (SCALE_MAX in src/enhance/enhance.c).
min = 1
max = 4
default = 1
config = "render.scale"
labels = { "1" = "640×480, as on the Xbox", "2" = "1280×960", "3" = "1920×1440", "4" = "2560×1920, the sharpest" }

[[wizard.option]]
key = "fullscreen"
label = "Start fullscreen"
kind = "bool"
default = false
config = "present.fullscreen"

[[wizard.option]]
key = "hud_pack"
label = "Sharper HUD and menus"
hint = "Redrawn from your own game files."
# Shown with the link only while [enhance.hud] font is not installed, or
# the wizard cannot tell (`blinx2 wizard font`); macOS ships the font.
font_hint = "On Windows and Linux it needs the free PT Sans Narrow Bold font: install it, then build."
# The family page offers Regular and Bold (700); the build reads Bold.
hint_link = { text = "Get PT Sans Narrow (free, Google Fonts)", url = "https://fonts.google.com/specimen/PT+Sans+Narrow" }
kind = "bool"
default = false
flag = "--hud-pack"

# The languages the disc carries, in the dashboard's order: the menu offers
# these as system.language, and the runtime takes no other (CLI [system],
# The tracker item).
[system]
languages = ["en", "ja", "de", "fr", "es", "it"]

# The HUD table for the toolkit's HUD layer and what `blinx2 hud-map`
# captures and checks it on (openspec change hud-anchors, section 3).
[hud]
table = "config/hud.toml"
scenarios = ["@stage1", "@stage1-2-barricade", "@attract", "@story-hub"]
mod = "hud"

# The owner's HUD texture pack (blinx2 enhance hud; openspec change
# enhancements-hud-pack). The UI set is the HUD, menu, icon and font
# textures of media.ipk (names from the HUD spike, analysis/enhancements/
# hud-typography.md); the per-language text strips are pre-rendered and
# left out. The Latin font atlas is ten rows of proportionally packed
# glyphs (24-px pitch for the six ASCII rows, ~28 for the four Latin-1
# ones); font_rows names them in atlas order, read off the dump. '@' is
# drawn as the copyright sign and '^' as an arrow icon, which stays stock.
[enhance.hud]
archives = ["media"]
# Per language, the archives holding its text; `--language` picks (default
# the first). A picked language's entries are TEXT (built at 2x, BC3) and
# the rest is art. Only us has patterns below so far; the others' lng_*
# trees come with the text patterns (enhance-menu-preview phase 5).
languages = { us = ["lng_us"] }
textures = [
    "dds/font_*",
    "dds/b2_gamen_*",
    "dds/b2icon_*",
    "dds/pause_*",
    "dds/com_*",
    "dds/radar*",
    "dds/hub_*",
    "dds/slc_*",
    "dds/equip_*",
    "dds/sav_*",
    "dds/vs_*",
    "dds/tcrmes*",
    "dds/res_*",
    "dds/tankchip*",
    "dds/h_title*",
    "dds/icon_*",
    # Pre-rendered text (lng_us): the mission objectives (mis_mix, XPR0
    # textures in MIXF files), their title and "OR" (mess_mix demo_font*,
    # demo_or_*) and the result screen's banners and titles (dds/res_*).
    "lng_us/mis_mix/*",
    "lng_us/mess_mix/demo_font*",
    "lng_us/mess_mix/demo_or_*",
    "lng_us/dds/res_*",
]
scale = 4
# 256x256 and under: the full-screen backgrounds (hub_bg, h_title2, vs_bg,
# 1024x512) are not HUD and would be 32 MB each at 4x.
max_texels = 65536
font_atlas = "dds/font_arialnarrow_bold.dds"
font_rows = [
    " !\"#$%&'()*+,-./",
    "0123456789:;<=>?",
    "©ABCDEFGHIJKLMNO",
    "PQRSTUVWXYZ[\\]\uFFFD_",
    " abcdefghijklmno",
    "pqrstuvwxyz{|}~",
    "ÀÁÂÄÈÉÊËÌÍÎÏÒÓÔÕ",
    "ÙÚÛÜÝŸÇßÑÆ¿\uFFFDÖ",
    "àáâäèéêëìíîïòóôõ",
    "ùúûüýÿçßñæ¡ö",
]
# The game's HUD face is Arial Narrow Bold. PT Sans Narrow Bold (OFL 1.1)
# redraws the atlas at one scale (the stock cap height), so the stroke weight
# is near even; each glyph sits centred on its stock ink box and on the
# baseline, descenders included. The game's quads sample each glyph's whole
# slot (probed on Metal, 2026-10-12), so there is no font_margin: a glyph is
# shrunk only to stay in its slot (g and ¿ by 8%, ten others by less). The
# owner installs the font (macOS ships it); never vendored.
font = "PT Sans Narrow Bold"
# The game advances by each glyph's slot, and PT Sans Narrow's E, S, O are
# narrower than Arial Narrow's, which opened the gaps around them: each
# glyph is widened or narrowed up to 10% towards its stock ink width. PT
# Sans's brackets reach further below the baseline than Arial's, so they
# sat low against the caps: they span the stock ink box instead.
font_stretch = 10
font_full_height = "()[]{}"

# The owner's whole-game texture pack (blinx2 enhance textures; openspec
# change texture-upscale, D3). No [enhance.textures] classes.ui: the `ui` class
# is [enhance.hud]'s textures above, and `hud`, `ui`, `world`, `all`, `traced`
# and `custom` are the CLI's own presets. world = ["*"] says a name outranks
# what one run saw of a texture's draws, so a 3D texture a menu happened to
# draw flat stays world. An entry only a dump knows has no name and goes by its
# draws. The owner's scales and upscalers are config/enhance-textures.toml's.
[enhance.textures]
sources = ["archive", "dump"]
classes = { world = ["*"] }
# First in `enhance textures compare`: the HUD, a tiled floor, a riveted wall.
preview = ["dds/b2_gamen_*", "dds/font_arialnarrow_bold.dds", "*/h_b2_tf_yuka0000", "*/h_b2_tf_kabe0000"]

[bench]
remote_name = ""
main_branch = "main"
toolkit_branch = "posix-host/portability"
toolkit_tests = true
pacing_scenario = "stage1"
# Tester logs and saves (cat/user-logs/<user>/, gitignored) are private and
# gigabytes; rsync does not read .gitignore, so keep them off the bench host.
sync_excludes = ["/user-logs/"]

[bench.gc]
# Where this workspace's notes name runs, beside the docs every game keeps.
# ../notes is the maintainer's layout: in a plain clone gc refuses until
# refs names only paths that exist there.
refs = ["../notes", "analysis", "docs", "README.md"]
# Inventories that list every run the P1 merge touched and every run the
# 2026-10-06 disk audit sorted (read, they would protect them all), the
# host inventories, gc's own saved dry runs, and raw run logs a worktree
# still holds (data, not docs).
refs_exclude = [
    "../notes/cleanup-scripts/*",
    "../notes/disk-audit-*/*",
    "../notes/MANIFEST.md",
    "../notes/*/gc-dry*.txt",
    "analysis/*inventory*.md",
    "analysis/runs/*",
]
# The audit's tier split: runs from the last three days may still be named.
days = 3

# The top-level entries beyond the standard layout (the CLI's
# docs/layout.md): the golden thresholds under analysis/, the toolkit's
# licence notice, the openspec commands for the agent, and the Python
# version uv picks.
[layout]
extra = ["analysis", "NOTICE", ".claude", ".python-version"]

# The public repo (the CLI's docs/layout.md): `blinx2 public init` once per
# clone, then each round `blinx2 public export` and the push it prints. The
# private notes, the patterns and the rewrite rules stay out of it.
[public]
url = "git@github.com:apexJCL/blinx2-recomp.git"
author = "carlos <4037632+apexJCL@users.noreply.github.com>"
# Globs dropped from the export on top of the CLI's private set. A tracked
# file on an ignored path needs one (scripts/test_public_exclude.py).
exclude = []

# xbr extract (local Godot project from the owner's dump; never published).
[extract]
vertex_header = 8
angles = "radians"
texname_size = 36
textures = "ipk:media:dds/{name}.dds"
# The chunk drawer (sub_00039100, sub_00044900, sub_00045A50) colours a UV
# strip (65) and any env-mapped strip (flag 0x40, kind 64 too) with the
# constant at 0xAD7FEC (white unless a fade sets it, alpha included) and
# keeps the material diffuse for other untextured strips (64), so M121's
# black-diffuse materials draw fully textured. It knows no other
# strip kind; none occur in the 21 stages.
textured_colour = "white"
# Collision (extract --collision): each area's collision tree is the first
# column of the stage map table (.data 0x40d180; sub_000E2180 copies it to
# 0xB8B840 + area * 4). sub_001642A0 bakes every tree into world triangles
# and an octree at load; sub_00165630 tests a sphere against them. The
# material diffuse is the surface class; sub_00165630 skips 0x00FFFF,
# 0x0000FF, 0x7F7F00 and 0xFF00FF while a global of its own is set, and
# never tests 0xFFFFFF. openspec/changes/archive/2026-11-03-collision-spike/design.md.
collision_skip = [0xFFFFFF]
# Placements (extract --placements, [[extract.placement_set]] below) live in
# the stage data turned a half turn about X: M21's items sit on its
# collision floors at (x, -y, -z) of their records.
placement_world = "-y"
# A stage's placements key is its stage_current (0xB87168) index, from the
# section switch in sub_00169D10 (table 0x169F78): area a's stages are
# 5a..5a+4 (M11 0, M13 2, M14 3, M21 5, ... M64 28, M91 40, M93 42, M111
# 50, M121 55); 5a+1 and 5a+4 load no section of their own. At an
# area's first stage the sets' layers ([s], [s+1], [s+4]) are what it
# loads in Sweepers, one player. The other stages load layer 0 only
# (placement_layers), the x-4 boss stages their enemies from [s-2] and M44
# no emitters at all (openspec/changes/archive/2026-11-03-placements-spike/design.md).

# Collision surface classes by name (extract --collision names the nodes
# col_<name>_0x<rrggbb>). sub_00165630 skips the four switched classes while
# their globals are set; stage_area_setup sets 0x65B1F0, 0x65B1E0 and
# 0x65B1EC and clears 0x65B1E8. Names inferred from the code that flips
# each global, not observed in play: openspec/changes/archive/2026-11-03-collision-spike/
# design.md section 8. The other always-tested types (0x7F0000,
# 0xB2B2B2, ...) stay unnamed.
[[extract.collision_class]]
value = 0xBFBFBF  # always tested: walls and floors alike
name = "solid"

[[extract.collision_class]]
value = 0x00FFFF  # [0x65B1F0]: tested only around the enemy and object updates
name = "enemy_wall"

[[extract.collision_class]]
value = 0x7F7F00  # [0x65B1E0]: only the camera's height probe on M21 and M23
name = "camera_floor"

[[extract.collision_class]]
value = 0x0000FF  # [0x65B1EC]: never cleared; no stage holds it
name = "unused_blue"

[[extract.collision_class]]
value = 0xFF00FF  # [0x65B1E8]: set only while stage_render runs the camera
name = "camera_pass"

[[extract.collision_class]]
value = 0xFFFFFF  # never tested (collision_skip)
name = "untested"

# Stages: one per M section. Roots are the stage map table's rows (.data
# 0x40d180 and the parallel rows at 0x40d454, by area) plus the parts in
# each area record's second part list; the first list is the mirrored
# reflection (drawn into a render target, kept only for M111 and M34, whose
# floors show it) and part lists outside area records are runtime-placed
# gimmicks, both otherwise left out. Each root draws with its own texlist. Method
# and the S4 check: openspec/changes/archive/2026-11-03-engine-extract/design.md.
#
# Reflections: sub_00219940 draws an area's first part
# list (area +0xDC, when area +0xAC bit 3 is set) into a render target made
# by sub_002161C0, cleared to opaque black (sub_002E5630; the clear colour's
# floats at 0xF2A878 are only ever zeroed), and sub_00219DC0 blends that
# target over a grid at the area's height. sub_000E4440 draws each part
# (root, texlist, f) under a scale of (1, -1, 1) after a (0, -f, 0)
# translation, so the copy lands at y' = f - y: transform scale [1, -1, 1],
# translation [0, f, 0], with the target's black as the backdrop. The method
# fits where the grid lies on a floor mesh, which then shows the copy
# through (texture_alpha). In M11, M14, M53 and M91 the grid is the water
# surface itself, with no mesh of its own, and the copy would sit under an
# opaque sea or pool bed; M44's reflective area (0x4B3430, at x, z = 5000)
# holds only runtime-placed parts. Those are left out.

[[extract.stage]]
name = "M11"
section = "M11"
placements = 0
collision = [0x0195FC48, 0x01996174, 0x019FAAC8]
root = [0x01A091DC, 0x019F6C80, 0x0198C064, 0x01A22DC8, 0x01A3A8B8, 0x01A5BEC8, 0x01A2C418, 0x01A52BE8, 0x01A53040]
texlist = [0x01A093C0, 0x019F739C, 0x0198C878, 0x01A1FFE0, 0x01A35F18, 0x01A574BC, 0x01A2B8D4, 0x01A52308, 0x01A52D40]

# M13 adds the roots its stage code draws outside the tables: the glass
# floor over the mirror pit (0x018F4858), the lamp glows (0x018F9450, both
# from sub_000E61A0's M13 case), the sky (0x018FEA0C) and the grass
# (0x018F6128, drawn by sub_000E6FA0). sub_000E61A0 draws the sky a second
# time: it pushes the matrix (sub_0003F980), scales it by (1, -1, 1) about
# the world origin (sub_0003FF50), flips the cull mode and draws again. That
# draw is the half below the horizon, so the last root is the sky again with
# that scale. The two 4,600-wide planes (0x01903248, 0x019069E0, drawn by
# sub_0021A830) take a texlist set at runtime and are left out.
[[extract.stage]]
name = "M13"
section = "M13"
placements = 2
placement_layers = {gimmick = [0], emitter = [0], emitter2 = [0]}
collision = [0x017FB3F0]
root = [0x018BD8A8, 0x018E3220, 0x018F4858, 0x018F9450, 0x018FEA0C, 0x018F6128, 0x018FEA0C]
texlist = [0x018BE174, 0x018DFFE4, 0x018F42C4, 0x018F61A8, 0x018FC110, 0x018F48B0, 0x018FC110]
transform = [{}, {}, {}, {}, {}, {}, {scale = [1, -1, 1]}]

[[extract.stage]]
name = "M14"
section = "M14"
placements = 3
placement_layers = {gimmick = [0], emitter = [0], emitter2 = [0], enemy = [-2]}
collision = [0x02387608]
root = [0x02420798, 0x023D09D4, 0x02475208]
texlist = [0x02420C2C, 0x023D0E40, 0x0246F8FC]

# Table rows only: the area's second part list is in BSS, filled at runtime.
# The floor reflects the room: the area's first part list (0x4AC2A8: root
# 0x02A739AC, texlist 0x02A5F5FC, f = -0.1) mirrored to y' = -0.1 - y, and
# sub_00219DC0 blends the target over the floor. The mirrored copy stands in
# for the target; the centre disc lets it show through at 0.4, which brings
# the dark marble to the teal the game's floor averages. The copy's
# walls end at y = 0, so they meet the floor's underside a tenth below it.
