# game.toml: what xboxrecomp-cli needs to know about this game. The CLI reads
# it on every command; see the CLI's docs/manifest.md for every key.
schema = 1

[game]
name = "BLiNX 2"
slug = "blinx2"
env_header = "src/env/recomp_env_game.h"
env_doc = "docs/env.md"

[xbe]
path = "game_files/default.xbe"
title_id = 0x4D530065
# The known dumps: the goldens were recorded on the old one (aa186954). The
# two have the same section bytes, entry point and kernel thunk; only the
# header differs (TASKS.md, 2026-10-06), so both are known. Another dump
# builds, packages and plays with a warning; bench golden refuses it.
sha256 = [
    "0c57fd72053077bc938876d1f2477b937e1f70566500c0e020bb45bbfa4ddc5e",
    "aa186954c47d9f0a98f8690948e8c43bae15201aa49c3457a42402a142b0c60e",
]

# The CLI and the toolkit, each at a release tag. The commit locks the tag:
# a tag that names another commit (moved, re-pushed) is refused.
[cli]
tag = "v0.6.7"
commit = "a7cdc15c80fa96e1f304739eb281f5245266e65e"
url = "https://github.com/apexJCL/xboxrecomp-cli.git"

[toolkit]
url = "https://github.com/apexJCL/xboxrecomp.git"
tag = "blinx2-v0.3.1"
branch = "blinx2/portability"
commit = "ac27175a3f54ff94bc272d1de533ccfa8557f409"

[toolchain]
llvm_mingw = "20260922"
nsis = "3.13"

[pipeline]
game_name = "cat"
gen = "src/recomp/gen"
out = "analysis"
seeds = ["config/seed_functions.json"]
icall_seeds = true
spin_waits = "config/spin_waits.json"
exclude_manual = "src/recomp_manual.c"
split = 250
names_hooks = ["scripts/host_reserved_names.py"]
ghidra = true

[pipeline.disasm]
text_only = true
extra_sections = ["D3D", "D3DX", "XGRPH", "DSOUND", "PSFD_I", "PSFD_B", "PSFD_P", "PSFD00", "SRCADV", "SRCED", "SRCAC", "XPP"]

[build]
exe = "cat_recomp"
targets = ["windows", "macos"]
windows_dir = "build-win"
macos_dir = "build"
# Passed on every packaging configure so a cache cannot keep a non-stock
# value; nonstock_vars are what package refuses without --allow-nonstock.
stock_cmake = ["-DXBOXRECOMP_ENHANCE=ON", "-UCAT_GEN_OPT"]
nonstock_vars = ["CAT_GEN_OPT"]
icon_var = "CAT_APP_ICON"

[data]
game_files = "game_files"
game_files_exclude = ["default_analysis.json", "UDATA", "TDATA"]
dir_env = "BLINX2_DATA_DIR"
windows = "%LOCALAPPDATA%\\BLiNX2"
steamos = "~/Games/BLiNX2"
macos = "~/Library/Application Support/BLiNX2"

[input]
script_env = "RECOMP_INPUT_SCRIPT"
presets = ["@attract", "@stage1", "@stage1-enemies", "@story-hub", "@story-load"]

[golden]
json = "analysis/golden/golden.json"
frames = "analysis/golden/frames"
audio = "analysis/golden/audio.json"
# The game's own enhancement keys at their stock values (docs/env.md): a
# golden run showing another value is not a stock run.
enhance_stock = { "fps.mode" = "lock30", "fx.glow" = "on", "fx.glow_intensity" = "1" }

[package]
app = "BLiNX2"
product = "blinx2-recomp"
targets = ["windows", "steamos", "macos"]
brew = ["sdl2", "sdl3", "openssl", "libepoxy"]
dylib_companions = ["libSDL3.dylib=brew:sdl3"]
content = "packaging"
templates = "packaging"
icon = "xbe"

# The owner's HUD texture pack (blinx2 enhance hud; openspec change
# enhancements-hud-pack). The UI set is the HUD, menu, icon and font
# textures of media.ipk (names from the HUD spike, analysis/enhancements/
# hud-typography.md); the per-language text strips are pre-rendered and
# left out. The Latin font atlas is ten rows of proportionally packed
# glyphs (24-px pitch for the six ASCII rows, ~28 for the four Latin-1
# ones); font_rows names them in atlas order, read off the dump. '@' is
# drawn as the copyright sign and '^' as an arrow icon, which stays stock.
[enhance.hud]
archives = ["media"]
# Per language, the archives holding its text; `--language` picks (default
# the first). A picked language's entries are TEXT (built at 2x, BC3) and
# the rest is art. Only us has patterns below so far; the others' lng_*
# trees come with the text patterns (enhance-menu-preview phase 5).
languages = { us = ["lng_us"] }
textures = [
    "dds/font_*",
    "dds/b2_gamen_*",
    "dds/b2icon_*",
    "dds/pause_*",
    "dds/com_*",
    "dds/radar*",
    "dds/hub_*",
    "dds/slc_*",
    "dds/equip_*",
    "dds/sav_*",
    "dds/vs_*",
    "dds/tcrmes*",
    "dds/res_*",
    "dds/tankchip*",
    "dds/h_title*",
    "dds/icon_*",
    # Pre-rendered text (lng_us): the mission objectives (mis_mix, XPR0
    # textures in MIXF files), their title and "OR" (mess_mix demo_font*,
    # demo_or_*) and the result screen's banners and titles (dds/res_*).
    "lng_us/mis_mix/*",
    "lng_us/mess_mix/demo_font*",
    "lng_us/mess_mix/demo_or_*",
    "lng_us/dds/res_*",
]
scale = 4
# 256x256 and under: the full-screen backgrounds (hub_bg, h_title2, vs_bg,
# 1024x512) are not HUD and would be 32 MB each at 4x.
max_texels = 65536
font_atlas = "dds/font_arialnarrow_bold.dds"
font_rows = [
    " !\"#$%&'()*+,-./",
    "0123456789:;<=>?",
    "©ABCDEFGHIJKLMNO",
    "PQRSTUVWXYZ[\\]\uFFFD_",
    " abcdefghijklmno",
    "pqrstuvwxyz{|}~",
    "ÀÁÂÄÈÉÊËÌÍÎÏÒÓÔÕ",
    "ÙÚÛÜÝŸÇßÑÆ¿\uFFFDÖ",
    "àáâäèéêëìíîïòóôõ",
    "ùúûüýÿçßñæ¡ö",
]
# The game's HUD face is Arial Narrow Bold. PT Sans Narrow Bold (OFL 1.1)
# redraws the atlas at one scale (the stock cap height), so the stroke weight
# is near even; each glyph sits centred on its stock ink box and on the
# baseline, descenders included. The game's quads sample each glyph's whole
# slot (probed on Metal, 2026-10-12), so there is no font_margin: a glyph is
# shrunk only to stay in its slot (g and ¿ by 8%, ten others by less). The
# owner installs the font (macOS ships it); never vendored.
font = "PT Sans Narrow Bold"
# The game advances by each glyph's slot, and PT Sans Narrow's E, S, O are
# narrower than Arial Narrow's, which opened the gaps around them: each
# glyph is widened or narrowed up to 10% towards its stock ink width. PT
# Sans's brackets reach further below the baseline than Arial's, so they
# sat low against the caps: they span the stock ink box instead.
font_stretch = 10
font_full_height = "()[]{}"

[bench]
remote_name = ""
main_branch = "main"
toolkit_branch = "posix-host/portability"
toolkit_tests = true
pacing_scenario = "stage1"

[bench.gc]
# Where this workspace's notes name runs, beside the docs every game keeps.
# ../notes is the maintainer's layout: in a plain clone gc refuses until
# refs names only paths that exist there.
refs = ["timeline", "../notes", "analysis", "docs", "README.md"]
# Inventories that list every run the P1 merge touched and every run the
# 2026-10-06 disk audit sorted (read, they would protect them all), the
# host inventories, gc's own saved dry runs, and raw run logs a worktree
# still holds (data, not docs).
refs_exclude = [
    "../notes/cleanup-scripts/*",
    "../notes/disk-audit-*/*",
    "../notes/MANIFEST.md",
    "../notes/*/gc-dry*.txt",
    "analysis/*inventory*.md",
    "analysis/runs/*",
]
# The audit's tier split: runs from the last three days may still be named.
days = 3
