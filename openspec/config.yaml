schema: spec-driven

context: |
  Project: static recompilation of the original Xbox game BLiNX 2: Masters of
  Time & Space (title 0x4D530065) into a native executable, built on the
  xboxrecomp toolkit cloned at ../xboxrecomp (linked via add_subdirectory).
  Language: C11. Build: CMake 3.20+. Python 3 tooling lives in the toolkit.
  Hosts: Windows x86-64, tested under Proton on Linux (llvm-mingw, D3D11
  render backend), and macOS on Apple Silicon (Clang, arm64, Metal render
  backend in an SDL2 window). The CPU rasterizer backend runs on both and is
  the default; RECOMP_PB_BACKEND picks cpu, d3d11, metal or null.
  Layout: src/main.c is the host entry point; src/recomp_manual.c holds
  hand-written overrides; src/recomp/gen/ is generated by
  scripts/pipeline.sh and must never be hand-edited; game_files/ holds the
  user's own dumped disc (never committed).
  Constraints: changes to ../xboxrecomp are upstream changes and should be
  avoided or kept minimal and upstreamable; prefer fixing things in this
  project. Generated code addresses guest memory as host = guest VA +
  g_xbox_mem_offset.

