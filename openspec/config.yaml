schema: spec-driven

context: |
  Project: static recompilation of the original Xbox game BLiNX 2: Masters of
  Time & Space (title 0x4D530065) into a native executable, built on the
  xboxrecomp toolkit (fork apexJCL/xboxrecomp, branch blinx2/portability),
  found at ../xboxrecomp and linked via add_subdirectory.
  Language: C11. Build: CMake. Python 3 tooling lives in the toolkit.
  Hosts: Windows x86-64 builds (llvm-mingw), tested under Proton on Linux with
  the D3D11 render backend; macOS on Apple Silicon (Clang, arm64) with the
  Metal render backend in an SDL2 window. The CPU rasterizer runs everywhere;
  RECOMP_PB_BACKEND picks cpu, d3d11, metal or null.
  Layout: src/main.c is the host entry point; src/recomp_manual.c holds
  hand-written overrides; src/recomp/gen/ is generated by scripts/pipeline.sh
  and is never hand-edited (missed functions are seeded in
  config/seed_functions.json, then regenerated from the disasm stage);
  game_files/ holds the user's own dumped disc and is never committed.
  Conventions: environment variables go through the toolkit's recomp_env
  table (config / trace / debug tiers; game keys in src/env/recomp_env_game.h)
  and every key has a row in docs/env.md; no raw getenv. Optional features
  default off and never change stock behaviour. A behaviour change on one
  render path (CPU, D3D11, Metal) is mirrored on the others or recorded as a
  follow-up. Comments explain why; match the surrounding code. Commit
  subjects read "area: what changed".
  Verification: golden frames (scripts/golden.py, analysis/golden/golden.json)
  always run at stock resolution and frame rate; audio via
  scripts/audio_check.py; the Proton host via scripts/bench.sh.
  Constraints: toolkit changes are kept upstreamable where possible and are
  later offered upstream as a separate PR set, each tested on Burnout 3 under
  Proton. No game data, frames, audio or saves are ever committed.

rules:
  proposal:
    - State which render backends, hosts and goldens the change affects.
    - Say whether it touches the toolkit and, if so, whether it is meant for upstream.
  design:
    - New settings go through recomp_env with a docs/env.md row; default off unless it fixes stock behaviour.
    - Say how CPU, D3D11 and Metal stay in agreement, or what is deferred.
  tasks:
    - Include the verification tasks - build on macOS and under Proton, the affected goldens, and unit tests or ctest for toolkit code.
    - Include a docs task when settings, scripts or user-visible behaviour change.
    - Include a review task before merge, and a task to remove the change's worktree and move its raw run output out of it after the merge.

operations:
  apply:
    guidance:
      - Work in your own worktree and branch; never edit the main checkouts.
      - Raw frame dumps and probe runs go outside the worktree; bench runs go to the shared bench-logs store.
      - Never hand-edit src/recomp/gen/; regenerate it.

