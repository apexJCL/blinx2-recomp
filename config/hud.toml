# BLiNX 2's HUD table for the toolkit's HUD layer (openspec change
# hud-anchors; schema: the toolkit's docs/runtime/config.md, "HUD table").
# src/hud_mod.c embeds it at build time. Rows come from `blinx2 hud-map`
# (capture, propose, review, emit); `blinx2 hud-map emit --check` and
# scripts/test_hud_table.py check them against the analysis.
version = 1

# The 2D sprites are in a fixed 640x480 space centred on the screen, y down:
# the half sizes at 0xA72360 / 0xA10C00 are only ever written 320.0 and
# 240.0 (0x63022, 0x6302C, 0x746F0, 0x746FA), so nothing to read at run time.
[canvas]
w = 640
h = 480
origin = "centre"
y = "down"
view = [0, 0, 640, 480]
target = "frame"
source = "fixed"

# sub_00042190's vertices: {x, y, u, v} f32, quads.
[layout]
stride = 16
x_off = 0
u_off = 8
prim = 4

# Their callers name the element: the two sprite helpers build one quad on
# their own stack and add it; sub_00018030 adds a number's digit quads;
# sub_00047A00 adds a string's glyph quads, and sub_00048600 calls it five
# times for one string (its outlined text). The digit helper is a wrapper
# because its add (0x18216) is shared by all its callers: the gold tally
# in sub_00092370 (at the left above the radar, not the counter)
# and two screens of sub_000EA270 that no capture reached,
# so a row there would move those screens' digits to the right edge too.
# sub_00018250 counts a number's digits and tail-jumps into the digit
# helper, so the helper's pre sees the return into sub_00018250's caller;
# it is a wrapper too so that caller's row follows a call to a wrapper
# (the item counter's big digit comes this way, from
# sub_0006B1F0 at stage play, and stayed at 4:3 while the rest of its block
# moved). sub_000EC630's call (0xEC785) and sub_0006AB30's five
# (0x6ACE4..0x6AD64, widgets 4 and 5 of sub_0006B1F0, whose text at 0x6AF44
# and 0x6B0C7 and sprite at 0x6B1DF are unlisted too) stay unlisted until a
# capture places their screens: keying only the digits would split the widget.
[[wrapper]]
va = 0x000177F0
name = "sprite"

[[wrapper]]
va = 0x000178C0
name = "sprite_frame"

[[wrapper]]
va = 0x00018030
name = "digits"

[[wrapper]]
va = 0x00018250
name = "digits_n"

# sub_00017330 is a sprite helper with 16 callers and one add (0x1740A):
# the time-control legend at the upper right (REW, PAUSE, ... while a
# control runs; sub_00072010's return sites 0x7235F and 0x7258A) and the
# restart dialog among them. As a wrapper, only its legend callers are
# keyed; the other 14 (one in SRCADV, return site 0x35E42C) stay
# unlisted, as they were.
[[wrapper]]
va = 0x00017330
name = "sprite_2"

[[wrapper]]
va = 0x00047A00
name = "text"

[[wrapper]]
va = 0x00048600
name = "text_outlined"

# What the captures found (task 3.3; level 1, D3D11, stage1, pause, the
# stage 1-2 barricade cutscene, the hub run from the title to stage 1, and
# the attract demo). A later `hud-map emit` keeps rows but not this:
# - No capture has a cinematic-bar site through the add, so there is no
#   `bars` group; the layer's H5 rule covers full-width untextured batches.
# - Unlisted on purpose: 0x0021703A (sub_00216D70's zero-area quads, every
#   frame of play) and 0x0005EC43 (text through 0x48691 with no vertex
#   location, level 0 only).
# - sub_0006B1F0's font calls: Time is 0x6DCF2 and "/ 5" is 0x6E8FD.
# - The world markers (0x412A8) spread continuously out to about x +-950
#   with no far cluster: the game draws them past the 4:3 edge itself and
#   parks none, so `markers` has no `park` bound.
# - Menus and the locker room keep 4:3 (centre): their frames (0x1E19DA,
#   0x2528B) have windows onto pictures drawn by other calls on queue 1
#   (0x1E1A9A), so stretching or moving one part misaligns the rest.
# - Where the framework's proposal was corrected to the tracker item's element table:
#   the markers 0x412A8 stretch -> world; lives, Time 0x6DCF2 and the gauge
#   0x6C5BA centre -> left (panel); the TS label 0x6EA92/0x6EAD4 centre ->
#   right (counter); the dialogue A button (0xF0E28/7D, 0xF10A6/DA) right
#   -> centre and its label (0xF24F9, 0xF253B, 0xF256B) left -> centre; the
#   pause panel (0x1EE144, 0x1EE30C and the rest) mixed -> centre; the pause
#   backdrops 0x171CA2/D08/FAF centre -> stretch; sub_0005EB30's loading
#   bands centre -> stretch; the menus (sub_001E0DF0, sub_001C3AC0,
#   sub_00022110, 0x1F50CD, ...) right or left -> centre; the boot backdrop
#   0x1845C and the save dim 0x1FB61 -> stretch.
[[group]]
name = "panel"
kind = "left"

[[group]]
name = "radar"
kind = "left"

[[group]]
name = "counter"
kind = "right"

[[group]]
name = "time_control"
kind = "centre"

[[group]]
name = "banner"
kind = "centre"

[[group]]
name = "dialogue"
kind = "centre"

[[group]]
name = "objectives"
kind = "centre"

[[group]]
name = "markers"
kind = "world"

[[group]]
name = "dim"
kind = "stretch"

[[group]]
name = "boot_backdrop"
kind = "stretch"

[[group]]
name = "menu_dim"
kind = "stretch"

[[group]]
name = "demo_logo"
kind = "right"

[[group]]
name = "briefing"
kind = "centre"

# Stretched: right at 16:9 (1.33x); at 21:9 its rounded panel frame and
# checker strip stretch 1.75x (sheets v219pause.png, frame 1800), left for
# the user's eye at the pre-release round.
[[group]]
name = "pause_backdrop"
kind = "stretch"

[[group]]
name = "loading"
kind = "stretch"

[[group]]
name = "pause"
kind = "centre"

[[group]]
name = "title"
kind = "centre"

[[group]]
name = "menu"
kind = "centre"

[[group]]
name = "gold"
kind = "left"

[[group]]
name = "goal"
kind = "right"

# The time-control legend sits alone at the upper right, so it gets its own
# right group: `counter` is the block at the bottom right, and the legend is
# drawn only while a control runs. The "+" that sub_00072010
# draws next to the second legend through the text wrapper is here too, so
# the two move together.
[[group]]
name = "tc_legend"
kind = "right"

