# symbols.toml: BLiNX 2's symbol map, the names we have learnt for game
# addresses (openspec change entity-system-spike, Part A).
#
# One [[symbol]] table per address, sorted by address so branches that add
# entries merge cleanly:
#   addr     the guest VA (0x%08X, uppercase hex). A field of a struct that
#            only lives on the heap has no addr; it goes at the end, sorted
#            by struct then offset.
#   name     <prefix>_<what it does>, lowercase snake case, unique.
#   kind     "function" | "global" | "field" | "label"; a label is a code
#            site inside a function (a hook point, a read or write we found),
#            never a function start.
#   struct   fields only: the struct's name; offset: from its base.
#   note     what it is, or what we saw it do.
#   source   where it was learnt: the openspec change and file, or the
#            source file, plus the tracker item when there is one. Sources
#            under analysis/research/ are untracked notes (in the main
#            checkout only); a branch is named with its tip sha.
#   conflict optional: what an earlier source said that a later one corrected.
#   in_gen   false when a function has no sub_XXXXXXXX in src/recomp/gen:
#            HLE overrides, and functions gen has under another name
#            (atexit_002D5678, xbe_entry_point). ghidra_only = true when
#            Ghidra knows it as a function.
#
# Prefixes, by subsystem: nj_ Ninja library, lib_ other XDK and C runtime
# code, d3d_ Direct3D and XGRAPHICS, pb_ pushbuffer, snd_ sound, sys_ boot,
# main loop, threads, memory, files and saves, pad_ input, fmv_ movies,
# gfx_ game-side rendering, cam_ camera, stage_ stage, area and frame loop,
# ent_ entities, hud_ HUD and 2D, menu_ menus and shop, evt_ events and
# cutscenes, tc_ time control. scripts/test_symbols.py holds the list.
#
# A name changes only with a new source: a wrong name is worse than sub_.
# Whoever learns what an address does adds it here in the same branch.
#
# The file stays in a TOML subset (one key = value per line, integers, booleans and
# basic strings) that scripts/ghidra/ImportSymbolMap.java reads.

