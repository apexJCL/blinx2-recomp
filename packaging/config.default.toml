# BLiNX 2 options: every key at its stock value. The game reads this file
# on each launch, beside its executable; it is never copied, and an update
# replaces it, so new keys and defaults reach you. Do not edit it: put the
# keys you change in config/config.toml (copy a line from here), which the
# game creates with a short comment the first time and never overwrites.
# Environment variables (RECOMP_*, config/launch.env in a bundle) override
# both. Reference: the toolkit's docs/runtime/config.md.

[render]
scale = 1                 # internal resolution factor: 1 (stock 640x480), 2, 3, ...

[display]
aspect = "4:3"            # only 4:3 so far

[present]
filter = "nearest"        # "nearest" (stock), "linear", "integer"
fullscreen = false        # true: borderless fullscreen at start
pacing = "spin"           # "spin" (stock: the frame wait holds a CPU core, as on
                          # the Xbox) or "sleep" (it sleeps until the next
                          # vblank instead; the frames are the same)

[fps]
mode = "lock30"           # lock60 and free are not available for this title:
                          # the stage logic steps a fixed 1/30 s per frame

[fx]
glow = "on"               # "on" (stock) or "off": the game's soft glow pass
glow_intensity = 1.0      # 0.0 .. 2.0: a scale of that layer (1.0 is stock)

# [textures]
# pack = "enhance/hud.pack" # your own HUD texture pack, made from your dump by
#                           # `blinx2 enhance hud`; `blinx2 package --hud-pack`
#                           # adds it to your bundle and turns this on, for a
#                           # first install and an upgrade alike. To turn it
#                           # off, put pack = "none" under [textures] in
#                           # config/config.toml. On macOS the path is
#                           # ../Resources/enhance/hud.pack
