# BLiNX 2 options: every key at its default. Each enhancement default is the
# stock behaviour except two: present.pacing sleeps (the frames and pace
# are the same as the console's spin and it frees a CPU core), and the
# in-game menu is on (closed, it changes no frame; the game loses only the
# presses of the chords that open it, Guide+A and Back+L3). The [input]
# table turns the keyboard and mouse on for player 1, with this game's
# layout and stick feel (stick_ramp_ms, walk_key, walk_scale; the toolkit's
# own defaults are 0, none and 1.0). The game reads this file
# on each launch, beside its executable; it is never copied, and an update
# replaces it, so new keys and defaults reach you. Do not edit it: put the
# keys you change in config/config.toml (copy a line from here), which the
# game creates with a short comment the first time and never overwrites.
# Environment variables (RECOMP_*, config/launch.env in a bundle) override
# both. Reference: the toolkit's docs/runtime/config.md.

[render]
scale = 1                 # internal resolution factor: 1 (stock 640x480) to 4
                          # (Metal and Direct3D 11; the software renderer
                          # ignores it)
aniso = 0                 # anisotropic filtering on mipmapped textures: 0 (stock,
                          # off) or 2..16; sharper ground and walls at a distance
                          # (Metal and Direct3D 11)

[display]
aspect = "4:3"            # "4:3" (stock) or wider, "16:9", "16:10", "21:9": Hor+ (Metal, D3D11)
movie = "black"           # with a wide aspect: "black" (pillarbox), "fit" (stretch), "fill" (crop)

[present]
filter = "nearest"        # "nearest" (stock), "linear", "integer"
fullscreen = false        # true: borderless fullscreen at start
pacing = "sleep"          # "sleep": the frame wait sleeps until the next vblank,
                          # which saves CPU and battery; the frames are the
                          # same. "spin" is the console-original timing: the
                          # wait holds a CPU core, as on the Xbox
surface = "auto"          # "auto": the frame-sized surface goes to gamescope for
                          # it to scale when the SteamOS launcher says it runs
                          # there (Steam's FSR needs scale = 1 on a Deck);
                          # "window" (the old behaviour) or "internal"

[menu]
enabled = true            # the in-game menu over the game: F10, Guide+A or
                          # Back+L3 held 0.4 s opens and closes it, and on
                          # macOS an Elite's P1 too (XInput has no paddles).
                          # Steam Deck: SteamOS keeps Guide+A for itself, so
                          # use Back+L3, or bind R4 to F10 once in Steam
                          # Input (the game's controller settings > Back Grip
                          # Buttons > R4 > Keyboard > F10). The game keeps
                          # running behind it and gets no input. Save writes
                          # only what you changed to config/config.toml.
                          # false: no menu; with the strip off too, no
                          # binding under [input.actions] is read

[overlay]
stats = false             # the stats strip in the window's top right corner (fps,
                          # frame ms, pacing, scale, backend); F3 or the
                          # menu's Stats page toggles it while you play

[fps]
mode = "lock30"           # lock60 and free are not available for this title:
                          # the stage logic steps a fixed 1/30 s per frame

[fx]
glow = "on"               # "on" (stock) or "off": the game's soft glow pass
glow_intensity = 1.0      # 0.0 .. 2.0: a scale of that layer (1.0 is stock)

[camera]
free = "off"              # "on": a free-flying camera you start and stop with
                          # free_toggle; the pad (sticks, triggers, X/Y up and
                          # down, White fast, Black slow) and the mouse fly it
                          # while player 1 stands still (Metal, Direct3D 11)
free_speed = 1.0          # 0.05 .. 20: fly speed
free_look_sens = 1.0      # 0.05 .. 10: look speed
free_hud = "keep"         # "keep" or "hide": the HUD when the camera starts
free_toggle = "F6"        # start and stop the free camera
free_hud_key = "F7"       # show or hide the HUD while flying
free_freeze_key = "F8"    # stop and restart the world while flying
free_reset_key = "F5"     # back to the game's camera

# [mods]
# "lod.enable" = "off"      # "on": characters keep their detailed models as far
#                           # away at 2x and 3x as at 480p (more draws); also on
#                           # the menu's Mods page
# "lod.follow_scale" = true # divide the detail distances by the render scale
# "lod.distance" = 1.0      # 0.5 .. 4: how far detail holds, on top of that

# [textures]
# pack = "enhance/hud.pack" # your own HUD texture pack, made from your dump by
#                           # `blinx2 enhance hud`; `blinx2 package --hud-pack`
#                           # adds it to your bundle and turns this on, for a
#                           # first install and an upgrade alike. To turn it
#                           # off, put pack = "none" under [textures] in
#                           # config/config.toml. On macOS the path is
#                           # ../Resources/enhance/hud.pack

[input]
# The keyboard and mouse are player 1 (port 0), merged onto a controller
# there. RECOMP_KEYBOARD and RECOMP_MOUSE override the two switches.
# Reference: docs/input.md.
keyboard = true             # keys drive player 1
mouse = true                # the mouse too: motion is a stick, buttons as bound below
mouse_look = "right_stick"  # what mouse motion drives: "right_stick" (the camera),
                            # "left_stick", "none"
mouse_sensitivity = 1.0     # 0.1 .. 10.0; 1.0: 40 counts in one frame is full deflection
mouse_invert_y = false      # true: mouse forward looks down
mouse_invert_x = false
mouse_min_deflection = 0.45 # 0.0 .. 0.9; any motion deflects at least this much, because
                            # the game ignores a stick under 0.4 of full
mouse_capture = "focus"     # "focus": the cursor is grabbed whenever the window has focus;
                            # "click": the first click in the window grabs it; "never"
mouse_release_key = "F9"    # frees the cursor (press again to grab it back; refocusing
                            # the window grabs it too)
wheel_pulse_ms = 100        # how long a wheel notch holds its control
stick_ramp_ms = 60          # a stick key reaches full deflection in this time; 0: at once
walk_key = "LAlt"           # held: the stick keys give walk_scale of full deflection
walk_scale = 0.5            # 0.41 .. 1.0

[input.bindings]
# Each control = a key or mouse input, or a list of them; [] unbinds. To
# change one, put the control under [input.bindings] in config/config.toml:
# it replaces this line whole, and an input you bind there leaves the
# controls below. Names: docs/input.md (RECOMP_TRACE=key prints them).
left_stick_up = ["W", "Numpad8"]  # move
left_stick_down = ["S", "Numpad2"]
left_stick_left = ["A", "Numpad4"]
left_stick_right = ["D", "Numpad6"]
right_stick_up = "I"        # camera (the mouse too, through mouse_look)
right_stick_down = "K"
right_stick_left = "J"
right_stick_right = "L"
dpad_up = "Up"              # menus and selection
dpad_down = "Down"
dpad_left = "Left"
dpad_right = "Right"
a = "Space"                 # jump; confirm
b = ["mouse2", "F"]         # action; back in menus
x = "E"                     # time control
y = "Q"
white = "C"
black = "Z"
left_trigger = "LShift"
right_trigger = ["mouse1", "R"] # sweep and shoot
left_thumb = "Tab"
right_thumb = "mouse3"      # camera
start = ["Enter", "Escape"] # pause; "press start"
back = "Backspace"

[input.actions]
# Host actions: what the host does, not the game. To change one, put it
# under [input.actions] in config/config.toml: it replaces this line whole.
# Reference: the toolkit's docs/runtime/config.md, "Host actions".
menu.open = ["F10", "guide+a", "paddle1", "back+left_thumb@400"]
                            # the toolkit's three, plus Back+L3 held 0.4 s for
                            # hosts that never pass Guide on (the Xbox Game Bar
                            # on Windows, Steam under Proton). The game ignores
                            # a lone Back or L3 press in play (Back acts only
                            # in menus)
overlay.stats = "F3"        # toggles the stats strip; no key of the game's
